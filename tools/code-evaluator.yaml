name: code-evaluator
description: Synthesize and format idiomatic competitive programming code implementations.
input_schema:
  type: object
  properties:
    language:
      type: string
      enum: [cpp, python, java, golang]
      description: Target programming language.
    algorithm:
      type: string
      description: Target algorithm or data structure to implement.
    code_body:
      type: string
      description: Source code implementation string.
  required:
    - language
    - algorithm
